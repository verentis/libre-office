apiVersion: apps/v1
kind: Deployment
metadata:
  name: office-editor
  namespace: __NAMESPACE__
spec:
  replicas: 2
  selector:
    matchLabels: {app: office-editor}
  template:
    metadata:
      labels: {app: office-editor}
    spec:
      containers:
        - name: editor
          image: __EDITOR_IMAGE__
          ports:
            - {name: http, containerPort: 3000}
          env:
            - {name: NUXT_COLLABORATION_URL, value: __PLATFORM_ORIGIN__}
            - {name: NUXT_CODE_URL, value: "http://office-code:9980"}
            - {name: NUXT_PUBLIC_WRAPPER_ORIGIN, value: "https://office.apps.verentis.dev"}
            - {name: NUXT_PUBLIC_EDITOR_ORIGIN, value: "https://office-code.apps.verentis.dev"}
            - {name: NUXT_PUBLIC_WOPI_ORIGIN, value: __PLATFORM_ORIGIN__}
          readinessProbe:
            httpGet: {path: /_ready, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 1000m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: office-editor
  namespace: __NAMESPACE__
spec:
  type: ClusterIP
  selector: {app: office-editor}
  ports:
    - {name: http, port: 3000, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: office-code
  namespace: __NAMESPACE__
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: office-code}
  template:
    metadata:
      labels: {app: office-code}
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        fsGroup: 1001
      containers:
        - name: code
          image: __CODE_IMAGE__
          ports:
            - {name: http, containerPort: 9980}
          securityContext:
            capabilities:
              add: [MKNOD]
          env:
            - {name: SAL_LOG, value: "-INFO-WARN"}
            - {name: aliasgroup1, value: __PLATFORM_ALLOWLIST__}
            - {name: extra_params, value: __CODE_PARAMS__}
          args:
            - __CODE_FRAME_POLICY__
          volumeMounts:
            - {name: shm, mountPath: /dev/shm}
            - {name: proof, mountPath: /etc/coolwsd/proof_key, subPath: proof_key, readOnly: true}
          readinessProbe:
            httpGet: {path: /hosting/discovery, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: 2000m, memory: 2Gi}
      volumes:
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 256Mi}
        - name: proof
          secret:
            secretName: office-code-proof
            defaultMode: 288
            items:
              - {key: proof_key, path: proof_key}
---
apiVersion: v1
kind: Service
metadata:
  name: office-code
  namespace: __NAMESPACE__
spec:
  type: ClusterIP
  selector: {app: office-code}
  ports:
    - {name: http, port: 9980, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: office-editor
  namespace: __NAMESPACE__
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/enable-access-log: "false"
spec:
  ingressClassName: nginx
  tls:
    - {hosts: [office.apps.verentis.dev], secretName: office-editor-tls}
  rules:
    - host: office.apps.verentis.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: office-editor
                port: {number: 3000}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: office-code
  namespace: __NAMESPACE__
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/enable-access-log: "false"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - {hosts: [office-code.apps.verentis.dev], secretName: office-code-tls}
  rules:
    - host: office-code.apps.verentis.dev
      http:
        paths:
          - path: /browser
            pathType: Prefix
            backend:
              service:
                name: office-editor
                port: {number: 3000}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: office-code
                port: {number: 9980}
