name: Tests
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
concurrency:
  group: office-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium for framing tests
        run: npx --no-install playwright install --with-deps chromium
      - run: npm run check && npm run check:framing
      - run: node scripts/verify-code-lock.mjs
      - run: npm run build
      # Real WOPI integration runs in the platform warm harness; Office has no substitute WOPI host.
      - run: docker build -f deploy/editor.Dockerfile -t office-editor:check . && node scripts/check-images.mjs office-editor:check
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification
          path: |
            artifacts/browser-results.json
            artifacts/packages/
            artifacts/deploy/
          retention-days: 7
