name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      everything:
        description: Ship every package and hosted app
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml
  delivery:
    needs: checks
    uses: verentis/.github/.github/workflows/app-release.yml@main
    with:
      everything: ${{ inputs.everything || false }}
    secrets: inherit
