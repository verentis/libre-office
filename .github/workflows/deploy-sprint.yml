name: Deploy Libre Office to sprint AKS
on:
  push:
    branches: ['feat/**']
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: office-sprint
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'verentis/libre-office' && startsWith(github.ref, 'refs/heads/feat/')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: sprint
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ACR_NAME: ${{ secrets.ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
      AKS_CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME }}
      AKS_RESOURCE_GROUP: ${{ secrets.AKS_RESOURCE_GROUP }}
      PLATFORM_ORIGIN: ${{ vars.PLATFORM_ORIGIN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium for framing tests
        run: npx --no-install playwright install --with-deps chromium
      - name: Check Libre Office wrapper and deployment
        run: npm run check && npm run check:framing
      - name: Validate required sprint settings and CODE pin
        run: node scripts/render-sprint.mjs --validate
      - name: Verify CODE manifest digest with registry
        run: node scripts/verify-code-lock.mjs
      - name: Azure login (repository OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Configure sprint cluster access
        shell: bash
        run: |
          set -euo pipefail
          az aks get-credentials --resource-group "$AKS_RESOURCE_GROUP" --name "$AKS_CLUSTER_NAME" --overwrite-existing
      - name: Provision persistent CODE proof key
        env:
          CODE_PROOF_KEY: ${{ secrets.CODE_PROOF_KEY }}
        run: node scripts/provision-code-proof.mjs verentis-apps
      - name: Check cluster prerequisites
        run: node scripts/check-sprint-prerequisites.mjs
      - uses: docker/setup-buildx-action@v3
      - name: Log in to sprint ACR
        run: az acr login --name "$ACR_NAME"
      - name: Build and push editor
        id: editor
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/editor.Dockerfile
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/verentis/office-editor:sha-${{ github.sha }}
          cache-from: type=gha,scope=office-editor
          cache-to: type=gha,scope=office-editor,mode=max
      - name: Recheck prerequisites and apply immutable workloads
        env:
          EDITOR_IMAGE: ${{ env.ACR_LOGIN_SERVER }}/verentis/office-editor@${{ steps.editor.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-sprint-prerequisites.mjs
          node scripts/render-sprint.mjs | kubectl apply -f -
          for name in office-code office-editor; do
            kubectl rollout status deployment/"$name" -n verentis-apps --timeout=10m
          done
          for name in office-code office-editor; do
            for ((attempt = 1; attempt <= 30; attempt++)); do
              if kubectl get -n verentis-apps certificate/"$name"-tls >/dev/null 2>&1; then break; fi
              sleep 5
            done
            kubectl wait -n verentis-apps --for=condition=Ready certificate/"$name"-tls --timeout=15m
          done
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors --max-time 15 https://office-code.apps.verentis.dev/hosting/discovery -o /dev/null
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors --max-time 15 https://office.apps.verentis.dev/_ready -o /dev/null
          test "$(kubectl get deployment office-editor -n verentis-apps -o jsonpath='{.spec.template.spec.containers[0].image}')" = "$EDITOR_IMAGE"

  publish:
    needs: deploy
    if: github.repository == 'verentis/libre-office' && startsWith(github.ref, 'refs/heads/feat/')
    uses: verentis/.github/.github/workflows/publish-verentis-package-sprint.yml@main
    with:
      package-root: manifests
      manifest: office.app.yaml
      overlay: environments/production.yaml
      visibility: Private
    secrets:
      sprint-api-url: ${{ secrets.SPRINT_API_URL }}
      publisher-signing-key: ${{ secrets.PUBLISHER_SIGNING_KEY }}
